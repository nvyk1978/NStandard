name: Build N Standard

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f source.zip
          unzip -o source.zip -d .
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Normalize APK filename
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          APK_DST="$APK_DIR/NStandard-0.1.1-2-debug.apk"

          echo "APK output directory:"
          find "$APK_DIR" -maxdepth 1 -type f -printf '%f\n' | sort || true

          if [[ -s "$APK_DST" ]]; then
            echo "Expected APK already exists: $APK_DST"
          else
            APK_SRC="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            if [[ -z "$APK_SRC" ]]; then
              echo "No APK was produced in $APK_DIR" >&2
              exit 1
            fi
            mv "$APK_SRC" "$APK_DST"
            echo "Renamed: $APK_SRC -> $APK_DST"
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/NStandard-0.1.1-2-debug.apk"
          test -s "$APK"

          BADGING="$("$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 5
          printf '%s\n' "$BADGING" | grep -F "package: name='com.cmyk.nstandard' versionCode='2' versionName='0.1.1'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NStandard-0.1.1-2-debug
          path: app/build/outputs/apk/debug/NStandard-0.1.1-2-debug.apk
          if-no-files-found: error
