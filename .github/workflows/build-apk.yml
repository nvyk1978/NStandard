name: Build N Standard

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f source.zip
          unzip -o source.zip -d .
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/nstandard-dev.keystore

      - name: Read app metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="com.cmyk.nstandard"
          VERSION_CODE="$(sed -nE "s/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p" app/build.gradle | head -n 1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)"

          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          grep -Fq "applicationId '$PACKAGE_NAME'" app/build.gradle

          APK_NAME="NStandard-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "APK_NAME=$APK_NAME"
          } >> "$GITHUB_ENV"

          printf 'Package: %s\nVersion: %s (%s)\nAPK: %s\n' \
            "$PACKAGE_NAME" "$VERSION_NAME" "$VERSION_CODE" "$APK_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Normalize APK filename
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          APK_DST="$APK_DIR/$APK_NAME"

          if [[ ! -s "$APK_DST" ]]; then
            APK_SRC="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$APK_SRC"
            if [[ "$APK_SRC" != "$APK_DST" ]]; then
              mv "$APK_SRC" "$APK_DST"
            fi
          fi
          test -s "$APK_DST"

      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/$APK_NAME"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          EXPECTED_CERT_SHA256="ED7C971D986B524DDC366D44471CD3534B0FABF46F028331EFE6A2CDB617DE32"

          test -s "$APK"

          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_OUTPUT"

          CERT_SHA256="$(printf '%s\n' "$CERT_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')"
          test -n "$CERT_SHA256"
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 5
          printf '%s\n' "$BADGING" \
            | grep -F "package: name='$PACKAGE_NAME' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
