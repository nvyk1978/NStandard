name: Build N Standard

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source.zip
        shell: bash
        run: |
          set -euo pipefail
          test -f source.zip
          unzip -o source.zip -d .
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/nstandard-dev.keystore

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -n 1)"
          VERSION_NAME="$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+['\"]([^'\"]+)['\"].*/\1/p" app/build.gradle | head -n 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"

          APK_BASENAME="NStandard-${VERSION_NAME}-${VERSION_CODE}-debug.apk"
          {
            echo "NS_VERSION_CODE=$VERSION_CODE"
            echo "NS_VERSION_NAME=$VERSION_NAME"
            echo "NS_APK_BASENAME=$APK_BASENAME"
            echo "NS_APK_PATH=app/build/outputs/apk/debug/$APK_BASENAME"
            echo "NS_ARTIFACT_NAME=NStandard-${VERSION_NAME}-${VERSION_CODE}-debug"
          } >> "$GITHUB_ENV"

          echo "Resolved N Standard ${VERSION_NAME} (${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace

      - name: Normalize APK filename
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          mkdir -p "$APK_DIR"

          if [[ ! -s "$NS_APK_PATH" ]]; then
            mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)
            test "${#APKS[@]}" -eq 1
            mv "${APKS[0]}" "$NS_APK_PATH"
          fi
          test -s "$NS_APK_PATH"

      - name: Verify APK identity and fixed signature
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"

          test -s "$NS_APK_PATH"
          "$APKSIGNER" verify --verbose --print-certs "$NS_APK_PATH"

          BADGING="$("$AAPT" dump badging "$NS_APK_PATH")"
          printf '%s\n' "$BADGING" | head -n 5
          printf '%s\n' "$BADGING" | grep -F "package: name='com.cmyk.nstandard' versionCode='$NS_VERSION_CODE' versionName='$NS_VERSION_NAME'"

          EXPECTED_SHA256="$(keytool -list -v \
            -keystore app/nstandard-dev.keystore \
            -storepass nstandard \
            -alias nstandard 2>/dev/null \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1 \
            | tr -d ':' \
            | tr 'A-F' 'a-f')"
          ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs "$NS_APK_PATH" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ':' \
            | tr 'A-F' 'a-f')"

          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA256"
          test "$EXPECTED_SHA256" = "$ACTUAL_SHA256"
          echo "Fixed signing certificate verified."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NS_ARTIFACT_NAME }}
          path: ${{ env.NS_APK_PATH }}
          if-no-files-found: error
